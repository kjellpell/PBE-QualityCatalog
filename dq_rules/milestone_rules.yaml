# =============================================================================
# MILESTONE BUSINESS RULES — maintained by the Case Management Team
# Table: Saksbehandling.Milepel
#
# Schema assumptions:
#   prosess_id  – foreign key linking this milestone row to Saksbehandling.Prosesser
#   Milepel     – the milestone type / name (e.g. "Startbehandling",
#                 "Stoppbehandling").  Other columns can be used by changing
#                 the "column" or the relevant parameter field in each rule.
#
# How to add a rule:
#   1. Pick the next rule_id (MIL-NNN).
#   2. Choose an expectation:
#        Standard GX:  expect_column_values_to_not_be_null
#                      expect_column_values_to_be_greater_than
#                      expect_column_values_to_be_in_set
#        Custom:       expect_no_duplicate_milestones
#                      expect_milestone_sequence
#                      expect_milestone_pairs_complete
#                      expect_no_orphan_milestones
#        Cross-column: validate_column_comparison
#                        parameters: column_A, column_B,
#                                    operator (>, <, >=, <=, ==, !=),
#                                    pk_column (default: Saksnummer)
#        SQL fallback: sql_validation
#                        parameters: sql (multiline query),
#                                    pk_column (optional column in result)
#   3. All column references are dynamic — edit the "column" or "parameters"
#      block to target a different column without touching Python.
#   4. Add the rule block below and save this file.
#   5. The next validation run will pick it up automatically.
# =============================================================================

rule_group: Milestone
table: Milepel
database: Saksbehandling
description: Data quality rules for milestone records linked to case processes

rules:

  # ---------------------------------------------------------------------------
  # Null / completeness checks
  # ---------------------------------------------------------------------------

  - rule_id: MIL-001
    name: Milepel column cannot be null
    description: >
      Every milestone row must identify the type/name of the milestone.
      A null Milepel means the record cannot be categorised or sequenced.
    expectation: expect_column_values_to_not_be_null
    column: Milepel        # <-- change this to target a different column
    severity: critical
    owner: Saksteam

  - rule_id: MIL-002
    name: prosess_id cannot be null
    description: >
      Every milestone row must be linked to a process via prosess_id.
      An unlinked milestone cannot be attributed to any case.
    expectation: expect_column_values_to_not_be_null
    column: prosess_id     # <-- change this to target a different column
    severity: critical
    owner: Saksteam

  # ---------------------------------------------------------------------------
  # Duplicate milestone checks
  # ---------------------------------------------------------------------------

  - rule_id: MIL-003
    name: No duplicate milestone types per process
    description: >
      Within a single process (prosess_id), each milestone type (Milepel)
      should appear at most once.  Duplicate milestone records indicate
      data entry errors or failed idempotency in the source system.
    expectation: expect_no_duplicate_milestones
    parameters:
      milestone_column: Milepel     # <-- column holding milestone type names
      group_column: prosess_id      # <-- column that identifies the process
    severity: high
    owner: Saksteam

  # ---------------------------------------------------------------------------
  # Milestone sequence checks
  # ---------------------------------------------------------------------------

  - rule_id: MIL-004
    name: Milestones must follow the defined sequence
    description: >
      When multiple milestones in the expected_sequence are present for the
      same process, they must appear in the correct chronological order
      (determined by date_column).  Out-of-order milestones indicate
      timeline recording errors.
    expectation: expect_milestone_sequence
    parameters:
      milestone_column: Milepel          # <-- column holding milestone type names
      group_column: prosess_id           # <-- column that identifies the process
      date_column: Milepel_dato          # <-- date/timestamp column used for ordering
      expected_sequence:                 # <-- define the required order here
        - Startbehandling
        - Behandling
        - Stoppbehandling
    severity: high
    owner: Saksteam

  # ---------------------------------------------------------------------------
  # Milestone pair completeness checks
  # ---------------------------------------------------------------------------

  - rule_id: MIL-005
    name: Milestone pairs must both be present
    description: >
      For each required pair, if either milestone type exists for a process
      the partner milestone must also exist.  A half-complete pair means
      the process lifecycle is unresolved.
    expectation: expect_milestone_pairs_complete
    parameters:
      milestone_column: Milepel          # <-- column holding milestone type names
      group_column: prosess_id           # <-- column that identifies the process
      required_pairs:                    # <-- list each [start, stop] pair
        - [Startbehandling, Stoppbehandling]
    severity: critical
    owner: Saksteam

  # ---------------------------------------------------------------------------
  # Orphaned (stop-without-start) checks
  # ---------------------------------------------------------------------------

  - rule_id: MIL-006
    name: Stop milestone without start milestone is invalid
    description: >
      A stop-type milestone (e.g. Stoppbehandling) cannot exist for a process
      that has no corresponding start-type milestone (e.g. Startbehandling).
      This represents a broken lifecycle record that must be corrected.
    expectation: expect_no_orphan_milestones
    parameters:
      milestone_column: Milepel          # <-- column holding milestone type names
      group_column: prosess_id           # <-- column that identifies the process
      pairs:                             # <-- [start_type, stop_type] pairs to check
        - [Startbehandling, Stoppbehandling]
    severity: high
    owner: Saksteam

  # ---------------------------------------------------------------------------
  # SQL fallback validations (sql_validation)
  # Write the query so that every returned row represents a violation.
  # ---------------------------------------------------------------------------

  - rule_id: MIL-007
    name: No milestone with EndDate before StartDate (SQL)
    description: >
      SQL fallback: detects milestone rows where EndDate is earlier than
      StartDate.  Groups by milestone type so the Power BI drill-through
      shows the affected milestone categories.
    expectation: sql_validation
    parameters:
      sql: |
        SELECT Milepel, COUNT(1) AS violation_count
        FROM Saksbehandling.Milepel
        WHERE EndDate IS NOT NULL
          AND StartDate IS NOT NULL
          AND EndDate < StartDate
        GROUP BY Milepel
        HAVING COUNT(1) > 0
      pk_column: Milepel
    severity: critical
    owner: Saksteam

