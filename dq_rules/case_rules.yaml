# =============================================================================
# CASE BUSINESS RULES — maintained by the Case Management Team
# Table: Saksbehandling.Prosesser
#
# How to add a rule:
#   1. Pick the next rule_id (CASE-NNN).
#   2. Choose an expectation:
#        Standard GX: expect_column_values_to_not_be_null
#                     expect_column_values_to_be_greater_than
#                     expect_column_values_to_be_in_set
#        Custom:      expect_milestone_order
#                     expect_milestone_pairs
#                     expect_no_open_milestone_pairs
#   3. Add the rule block below and save this file.
#   4. The next validation run will pick it up automatically.
# =============================================================================

rule_group: Case
table: Prosesser
database: Saksbehandling
description: Data quality rules for case processing workflow data

rules:

  # ---------------------------------------------------------------------------
  # Null / completeness checks
  # ---------------------------------------------------------------------------

  - rule_id: CASE-001
    name: Saksnummer cannot be null
    description: >
      Every row in Prosesser must reference a valid case number.
      A null Saksnummer means the process cannot be traced back to a case.
    expectation: expect_column_values_to_not_be_null
    column: Saksnummer
    severity: critical
    owner: Saksteam

  - rule_id: CASE-002
    name: Indikator cannot be null
    description: >
      Every process must have a valid indicator (case type / sakstype).
      Without an indicator the case cannot be categorised or reported correctly.
    expectation: expect_column_values_to_not_be_null
    column: Indikator
    severity: high
    owner: Saksteam

  - rule_id: CASE-003
    name: Saksbehandler_kode cannot be null for open cases
    description: >
      All open (active) processes must be assigned to a handler.
      Unassigned open cases represent a governance gap.
    expectation: expect_column_values_to_not_be_null
    column: Saksbehandler_kode
    severity: high
    owner: Saksteam

  # ---------------------------------------------------------------------------
  # Milestone ordering checks
  # ---------------------------------------------------------------------------

  - rule_id: CASE-004
    name: Start milestone must come before stop milestone
    description: >
      The earliest start milestone date (tidligste_startmilepael_dato) must
      not be later than the latest stop milestone date (seneste_stoppmilepael_dato).
      A reversed order indicates a data entry error.
    expectation: expect_milestone_order
    parameters:
      start_column: tidligste_startmilepael_dato
      stop_column: seneste_stoppmilepael_dato
    severity: critical
    owner: Saksteam

  - rule_id: CASE-005
    name: Early processing date requires a prior start milestone
    description: >
      Tidligbehandling_dato (early processing) cannot be recorded before the
      case officially started (tidligste_startmilepael_dato).
      If early processing precedes the start milestone, it is a sequencing error.
    expectation: expect_milestone_order
    parameters:
      start_column: tidligste_startmilepael_dato
      stop_column: Tidligbehandling_dato
    severity: high
    owner: Saksteam

  # ---------------------------------------------------------------------------
  # Milestone pair checks
  # ---------------------------------------------------------------------------

  - rule_id: CASE-006
    name: Closed cases must have a complete milestone pair
    description: >
      A case with Status = 'Saken er avsluttet' must have both a start and a
      stop milestone date populated.  A closed case with only one side of the
      pair is incomplete and cannot be used for processing-time reporting.
    expectation: expect_milestone_pairs
    parameters:
      start_column: tidligste_startmilepael_dato
      stop_column: seneste_stoppmilepael_dato
      closed_indicator: "Saken er avsluttet"
    severity: critical
    owner: Saksteam

  # ---------------------------------------------------------------------------
  # Open pair mismatch checks
  # ---------------------------------------------------------------------------

  - rule_id: CASE-007
    name: Stop milestone without start milestone is invalid
    description: >
      A stop milestone date (seneste_stoppmilepael_dato) cannot exist without
      a corresponding start milestone date (tidligste_startmilepael_dato).
      This represents a broken lifecycle record that must be corrected.
    expectation: expect_no_open_milestone_pairs
    parameters:
      start_column: tidligste_startmilepael_dato
      stop_column: seneste_stoppmilepael_dato
    severity: high
    owner: Saksteam
