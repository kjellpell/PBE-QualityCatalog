rule_group: Faser
table: faser
database: saksbehandling
description: Validering av datakvalitet for faser
pk_column: stage_recno
catalog_filter:
  type: custom
  where_clause: fagsystem = 'PB360'
joins:
- table: saksbehandling.saker
  left_on: to_case_recno
  right_on: case_recno
  how: left
  select:
  - case_recno
  - saksansvarlig_kode
rules:
- rule_id: FAS-001
  name: Saksnummer kan ikke være null
  description: 'Alle rader i faser må ha et gyldig saksnummer.'
  expectation: not_null
  column: to_case_recno
  severity: kritisk
  owner: Teknologi
- rule_id: FAS-002
  name: Stage_recno kan ikke være null
  description: 'Alle rader i faser må ha et gyldig stage_recno.'
  expectation: not_null
  column: stage_recno
  severity: kritisk
  owner: Teknologi
- rule_id: FAS-003
  name: Stage_recno må være unik på tvers av alle faser
  description: 'Dupliserte stage_recnoer indikerer et problem med dataregistrering.'
  expectation: combination_unique
  parameters:
    columns:
    - stage_recno
  severity: kritisk
  owner: Teknologi
- rule_id: FAS-004
  name: Saksbehandler_kode kan ikke være null for åpne saker
  description: 'Alle faser hvor sluttdato er null må være tildelt en saksbehandler.'
  expectation: not_null_when
  parameters:
    when_column: seneste_stoppmilepael_dato
    operator: IS NULL
    checked_columns:
    - saksansvarlig_kode
    - fase_lukket_dato
  severity: høy
  owner: Teknologi
- rule_id: FAS-005
  name: Seneste_stoppmilepael_dato må være større enn eller lik startdato
  description: 'For ferdige faser må seneste_stoppmilepael_dato ikke være tidligere enn startdato.'
  expectation: comparison
  parameters:
    left_column: seneste_stoppmilepael_dato
    right_column: tidligste_startmilepael_dato
    operator: '>='
  severity: høy
  owner: Teknologi
- rule_id: FAS-006
  name: Tidsbruk kan ikke være negativ
  description: 'Tidsbruk må være større enn eller lik 0.'
  expectation: comparison
  parameters:
    left_column: tidsbruk
    right_value: 0
    operator: '>='
  severity: høy
  owner: Teknologi
- rule_id: FAS-007
  name: Bransjetid kan ikke være negativ
  description: 'Bransjetid må være større enn eller lik 0.'
  expectation: comparison
  parameters:
    left_column: bransjetid
    right_value: 0
    operator: '>='
  severity: høy
  owner: Teknologi
- rule_id: FAS-008
  name: Opprinnelig frist og frist_dager må stemme overens
  description: >
    For faser med indikator Delesak 3 uker, Delesak 12 uker, Byggesak 3 uker
    og Byggesak 12 uker må opprinnelig_frist være lik frist_dager.
  expectation: sql_validation
  parameters:
    pk_column: stage_recno
    sql: |
      SELECT stage_recno, indikator, opprinnelig_frist, frist_dager
      FROM saksbehandling.faser
      WHERE fagsystem = 'PB360'
        AND indikator IN (
          'Delesak 3 uker',
          'Delesak 12 uker',
          'Byggesak 3 uker',
          'Byggesak 12 uker'
        )
        AND opprinnelig_frist IS NOT NULL
        AND frist_dager IS NOT NULL
        AND opprinnelig_frist != frist_dager
  severity: høy
  owner: Teknologi