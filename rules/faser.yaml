rule_group: Faser
table: faser
database: saksbehandling
description: Validering av datakvalitet for faser
pk_column: stage_recno
ownership_col: saksansvarlig_kode
escalation_days: 14

# Jeg har valgt å kun se på PB360-saker per nå
catalog_filter:
  type: custom
  where_clause: fagsystem = 'PB360'

# I de fleste tilfeller trenger vi å koble oss til saksbehandling.saker for å få saksbehandler_id, saksnummer etc.
# Denne informasjonen er nødvendig for Power BI rapporter over avvik og e-poster
joins:
- table: saksbehandling.saker
  left_on: to_case_recno
  right_on: case_recno
  how: left
  select:
  - case_recno
  - saksansvarlig_kode

# Context_columns er kolonner som brukes for å gi mer kontekst i rapporteringen av regelbrudd,
# Disse kolonnene brukes f.eks. når det skal sendes ut varsler og i Power BI-rapporter
context_columns:
  - saksnummer
  - stage_title
  - fase_opprettet_dato
  - seneste_stoppmilepael_dato
  - tidligste_startmilepael_dato

# not_null fungerer slik at det er mulig å sjekke flere kolonner for blanke verdier i samme regel
# her ligger tidligste_startmilepael_dato dobbelt med FAS-003, men tenker den hører mer hjemme i FAS-003 når ting er bøgfritt
rules:
- rule_id: FAS-001
  name: Verdier kan ikke være null
  description: 'Alle påkrevde rader må ha en verdi.'
  expectation: not_null
  parameters:
    columns:
      - to_case_recno
      - stage_recno
  routing: Teknologi

# Denne anser jeg for å være midlertidig?
- rule_id: FAS-001a
  name: tidligste_startmilepael_dato kan ikke være null
  description: 'Alle påkrevde rader må ha en verdi.'
  expectation: not_null
  parameters:
    columns:
      - tidligste_startmilepael_dato
  routing: Teknologi

# Dette er muligens en sjekk som allerede gjøres ved ingestion
- rule_id: FAS-002
  name: Stage_recno må være unik på tvers av alle faser
  description: 'Dupliserte stage_recnoer indikerer et problem med dataregistrering.'
  expectation: combination_unique
  parameters:
    columns:
    - stage_recno
  routing: Teknologi

# Forskjellen mellom not_null og not_null_when er at den første sjekker at kolonnen 
# ikke er null for alle rader, mens den andre sjekker at kolonnen ikke er null under visse betingelser. 
# I dette tilfellet sjekker den om fase_lukket_dato er null når seneste_stoppmilepael_dato ikke er null. 
# Dette betyr at for alle rader hvor seneste_stoppmilepael_dato har en verdi, må fase_lukket_dato også ha en verdi.
- rule_id: FAS-003
  name: Når siste milepæl er satt, må også andre kolonner ha verdi
  description: 'Alle faser må være lukket.'
  user_message: 'Fase mangler lukkedato selv om siste milepæl er registrert ({seneste_stoppmilepael_dato}). Kontroller sak {saksnummer} i fagsystemet.'
  expectation: not_null_when
  parameters:
    when_column: seneste_stoppmilepael_dato
    operator: IS NOT NULL
    columns:
    - fase_lukket_dato
    - tidligste_startmilepael_dato
  routing: Avdeling

# Formålet med denne regelen er å unngå at det finnes åpne faser i en sak, uten at saken har en saksbehandler.
# Det er veldig mange av disse, så kan det være at regelen er feil satt opp.
- rule_id: FAS-004
  name: Saksbehandler_kode kan ikke være null for åpne saker
  description: 'Alle faser hvor sluttdato er null må være tildelt en saksbehandler.'
  user_message: 'Fasen er åpen, men mangler saksbehandler. Tildel saksbehandler for sak {saksnummer} i fagsystemet.'
  expectation: not_null_when
  parameters:
    when_column: seneste_stoppmilepael_dato
    operator: IS NULL
    columns:
    - saksansvarlig_kode
  routing: Avdeling

# Dette er en viktig regelen, for å sikre at tidsbruk blir beregnet riktig
- rule_id: FAS-005
  name: Seneste_stoppmilepael_dato må være større enn eller lik startdato
  description: 'For ferdige faser må dato for vedtak/beslutning ikke være tidligere enn mottatt dato.'
  user_message: 'Fase ble avsluttet {seneste_stoppmilepael_dato}, men startdatoen er {tidligste_startmilepael_dato} — sluttdato kan ikke være før startdato. Kontroller milepælsdatoer for sak {saksnummer} i fagsystemet.'
  expectation: comparison
  parameters:
    left_column: seneste_stoppmilepael_dato
    right_column: tidligste_startmilepael_dato
    operator: '>='
  routing: Avdeling

# Sjekk på tidsbruk er egentlig bare en sikkerhetsventil, siden vi får dette tallet fra PB360 direkte
- rule_id: FAS-006
  name: Tidsbruk kan ikke være negativt tall
  description: 'Negativ tidsbruk er et tegn på feil registrering av start- eller sluttdato.'
  expectation: comparison
  parameters:
    left_column: tidsbruk
    right_value: 0
    operator: '>='
  routing: Teknologi

# Bransjetid beregner vi imidlertid selv, og må derfor ha en sjekk.
- rule_id: FAS-007
  name: Bransjetid kan ikke være negativt tall
  description: 'Negativ bransjetid er et tegn på feil registrering av start- eller sluttdato.'
  expectation: comparison
  parameters:
    left_column: bransjetid
    right_value: 0
    operator: '>='
  routing: Teknologi

# Fordi det ikke er noen begrensning på fristforlengelse i PB360, så må vi sjekke de indikatorene som normalt _ikke_ skal ha fristforlengelse
# Se også regelen under, som sjekker hvor stor fristforlengelsen er for de fasene som skal ha det 
# Det kan være fristforlengelse på Byggesak 12 uker, her kan vi vurdere om de skal bekreftes manuelt siden det er så få
- rule_id: FAS-008
  name: Opprinnelig frist og frist_dager må være lik for indikatorer uten fristforlengelse
  description: 'For faser uten fristforlengelse må opprinnelig_frist være lik frist_dager.'
  expectation: comparison
  parameters:
    left_column: opprinnelig_frist_dager
    right_column: frist_dager
    operator: '=='
    filter_column: indikator
    filter_values:
      - Delesak 3 uker
      - Delesak 12 uker
      - Byggesak 3 uker
      - Byggesak 12 uker
      - Endringstillatelse
      - Igangsettingstillatelse
      - Brukstillatelse
      - Ferdigattest
      - Seksjonering
      - Reseksjonering
      - Oppstartsmøte
  routing: Teknologi

# Denne sjekker om fristforlengelsen er lengre enn tillatt
- rule_id: FAS-009
  name: Forlenget frist kan ikke være lengre enn 126 dager for saker til politisk behandling
  description: 'Forlenget frist kan ikke være lengre enn 126 dager for saker til politisk behandling.'
  user_message: 'Forlenget frist er {actual_value} dager, som overstiger grensen på 126 dager for saker til politisk behandling. Kontroller sak {saksnummer} i fagsystemet.'
  expectation: comparison
  parameters:
    left_column: frist_dager
    operator: '<='
    right_value: 126
    filter_column: indikator
    filter_values:
      - Til politisk behandling
  routing: Avdeling

# Her er det en del avvik, og det stusser jeg litt på
- rule_id: FAS-010
  name: decisiondate kan ikke være lavere enn sluttdato 
  description: 'For ferdige faser må decisiondate ikke være tidligere enn sluttdato.'
  expectation: comparison
  parameters:
    left_column: decisiondate
    right_column: seneste_stoppmilepael_dato
    operator: '>='
  routing: Teknologi