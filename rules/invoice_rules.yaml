rule_group: Invoice
table: Fakturalinjer
database: Saksbehandling
description: Data quality rules for invoice line data linked to case processes
pk_column: Fakturanr
rules:
- rule_id: INV-001
  name: Fakturanr cannot be null
  description: 'Every invoice line must reference an invoice number. A null Fakturanr
    prevents the line from being traced to its invoice.

    '
  expectation: not_null
  column: Fakturanr
  severity: critical
  rule_category: Completeness
  owner: Finansteam
- rule_id: INV-002
  name: linje_belop cannot be null
  description: 'Every invoice line must have an amount recorded. A null amount makes
    it impossible to reconcile the invoice.

    '
  expectation: not_null
  column: linje_belop
  severity: critical
  rule_category: Completeness
  owner: Finansteam
- rule_id: INV-003
  name: Faktura_type cannot be null
  description: 'The invoice type must always be populated so the system knows how
    to classify and process each invoice line (e.g. standard vs. credit note).

    '
  expectation: not_null
  column: Faktura_type
  severity: high
  rule_category: Completeness
  owner: Finansteam
- rule_id: INV-004
  name: Negative amounts only allowed on credit notes (Kreditnota)
  description: 'A negative linje_belop is only valid when Faktura_type = ''Kreditnota''.
    Negative amounts on other invoice types indicate a data entry error or a missing
    credit-note classification.

    '
  expectation: value_when
  parameters:
    when_column: linje_belop
    operator: <
    value: 0
    required_column: Faktura_type
    required_value: Kreditnota
    pk_column: Fakturanr
  severity: high
  rule_category: Business Logic
  owner: Finansteam
- rule_id: INV-005
  name: Sum of line amounts must match invoice header total
  description: 'The sum of all linje_belop values for a given Fakturanr must equal
    the Faktura_belop recorded on the invoice header (within a small tolerance). A
    mismatch indicates either missing lines or a header update that was not reflected
    in the detail lines.

    '
  expectation: group_aggregate_matches
  parameters:
    group_column: Fakturanr
    aggregate_column: linje_belop
    reference_column: Faktura_belop
    aggregate: sum
    tolerance: 0.01
  severity: high
  rule_category: Aggregate
  owner: Finansteam
- rule_id: INV-006
  name: prosess_id must exist in Prosesser table
  description: 'Every prosess_id value in Fakturalinjer must reference an existing
    process in Saksbehandling.Prosesser.  Invoice lines without a valid parent process
    cannot be attributed to a case for reporting.

    '
  expectation: reference_exists
  parameters:
    column: prosess_id
    pk_column: Fakturanr
    reference_table: Saksbehandling.Prosesser
    reference_column: Saksnummer
  severity: high
  rule_category: Referential Integrity
  owner: Finansteam
- rule_id: INV-007
  name: SQL — invoices with zero total amount
  description: 'Invoices where the sum of all line amounts is zero may indicate incomplete
    data or cancelled invoices that were not properly closed. Uses the sql shorthand
    expectation (top-level sql: key).

    '
  expectation: sql_violations
  sql: 'SELECT Fakturanr, SUM(linje_belop) AS total_belop

    FROM Saksbehandling.Fakturalinjer

    GROUP BY Fakturanr

    HAVING SUM(linje_belop) = 0

    '
  severity: medium
  rule_category: Aggregate
  owner: Finansteam
- rule_id: INV-008
  name: ApprovedBy must reference an active employee
  description: 'Every approver recorded on an invoice line must exist as an active
    employee in the employee register. An invoice approved by a person who has left
    the organisation is a control violation and must be reviewed.

    '
  expectation: reference_active
  parameters:
    source_column: ApprovedBy
    pk_column: Fakturanr
    reference_table: Saksbehandling.Ansatte
    reference_column: AnsattKode
    reference_active_column: Status
    reference_active_value: Aktiv
  severity: critical
  rule_category: Referential Integrity
  owner: Finansteam
- rule_id: INV-009
  name: Unpaid invoices must not exceed 60 days outstanding
  description: 'An invoice line with no PaymentDate (unpaid) must not have been outstanding
    for more than 60 days since InvoiceDate. Invoices exceeding this threshold indicate
    a payment process failure and require escalation.

    '
  expectation: state_duration_within_limit
  parameters:
    start_column: InvoiceDate
    open_state_column: PaymentDate
    open_state_value: null
    pk_column: Fakturanr
    max_days: 60
  severity: high
  rule_category: Business Logic
  owner: Finansteam
