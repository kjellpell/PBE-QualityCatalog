# =============================================================================
# INVOICE BUSINESS RULES — maintained by the Finance Team
# Table: Saksbehandling.Fakturalinjer
#
# Schema assumptions:
#   prosess_id  – foreign key linking each invoice line to Saksbehandling.Prosesser
#   Fakturanr   – invoice number (primary key / grouping key)
#   linje_belop – line-level amount
#   Faktura_type – invoice classification (e.g. "Kreditnota")
#
# How to add a rule:
#   1. Pick the next rule_id (INV-NNN).
#   2. Choose an expectation:
#        Standard GX: expect_column_values_to_not_be_null
#                     expect_column_values_to_be_greater_than
#                     expect_column_values_to_be_in_set
#        Custom:      expect_refund_validation
#                     expect_invoice_total_consistency
#        Aggregate:   expect_column_sum_to_equal
#                       parameters: column, expected_value, tolerance (default 0.01)
#                     expect_row_count_to_be_between
#                       parameters: min_value, max_value
#                     expect_unique_combination_of_columns
#                       parameters: columns (list), pk_column
#        Cross-table: validate_foreign_key
#                       parameters: column, pk_column,
#                                   reference: {table, column}
#        SQL fallback: sql / sql_validation
#   3. For rules that target a specific column, set the top-level "column" field.
#      For multi-column or parameterised rules, use a "parameters" block.
#   4. Optionally set "category" for grouping (e.g. "Completeness",
#      "Business Logic", "Referential Integrity", "Aggregate").
#   5. Add the rule block below and save this file.
#   6. The next validation run will pick it up automatically.
# =============================================================================

rule_group: Invoice
table: Fakturalinjer
database: Saksbehandling
description: Data quality rules for invoice line data linked to case processes

# Table configuration used by validation_runner.py
pk_column: Fakturanr
prosess_id_column: prosess_id

rules:

  # ---------------------------------------------------------------------------
  # Null / completeness checks
  # ---------------------------------------------------------------------------

  - rule_id: INV-001
    name: Fakturanr cannot be null
    description: >
      Every invoice line must reference an invoice number.
      A null Fakturanr prevents the line from being traced to its invoice.
    expectation: expect_column_values_to_not_be_null
    column: Fakturanr
    severity: critical
    category: Completeness
    owner: Finansteam

  - rule_id: INV-002
    name: linje_belop cannot be null
    description: >
      Every invoice line must have an amount recorded.
      A null amount makes it impossible to reconcile the invoice.
    expectation: expect_column_values_to_not_be_null
    column: linje_belop
    severity: critical
    category: Completeness
    owner: Finansteam

  - rule_id: INV-003
    name: Faktura_type cannot be null
    description: >
      The invoice type must always be populated so the system knows how to
      classify and process each invoice line (e.g. standard vs. credit note).
    expectation: expect_column_values_to_not_be_null
    column: Faktura_type
    severity: high
    category: Completeness
    owner: Finansteam

  # ---------------------------------------------------------------------------
  # Amount / refund validation
  # ---------------------------------------------------------------------------

  - rule_id: INV-004
    name: Negative amounts only allowed on credit notes (Kreditnota)
    description: >
      A negative linje_belop is only valid when Faktura_type = 'Kreditnota'.
      Negative amounts on other invoice types indicate a data entry error or
      a missing credit-note classification.
    expectation: expect_refund_validation
    parameters:
      amount_column: linje_belop
      type_column: Faktura_type
      credit_type: Kreditnota
    severity: high
    category: Business Logic
    owner: Finansteam

  # ---------------------------------------------------------------------------
  # Invoice-level consistency checks
  # ---------------------------------------------------------------------------

  - rule_id: INV-005
    name: Sum of line amounts must match invoice header total
    description: >
      The sum of all linje_belop values for a given Fakturanr must equal the
      Faktura_belop recorded on the invoice header (within a small tolerance).
      A mismatch indicates either missing lines or a header update that was
      not reflected in the detail lines.
    expectation: expect_invoice_total_consistency
    parameters:
      invoice_id_column: Fakturanr
      line_amount_column: linje_belop
      header_amount_column: Faktura_belop
      tolerance: 0.01
    severity: high
    category: Aggregate
    owner: Finansteam

  # ---------------------------------------------------------------------------
  # Cross-table / referential integrity validations
  # ---------------------------------------------------------------------------

  - rule_id: INV-006
    name: prosess_id must exist in Prosesser table
    description: >
      Every prosess_id value in Fakturalinjer must reference an existing
      process in Saksbehandling.Prosesser.  Invoice lines without a valid
      parent process cannot be attributed to a case for reporting.
    expectation: validate_foreign_key
    parameters:
      column: prosess_id
      pk_column: Fakturanr
      reference:
        table: Saksbehandling.Prosesser
        column: Saksnummer
    severity: high
    category: Referential Integrity
    owner: Finansteam

  # ---------------------------------------------------------------------------
  # Aggregate validations
  # ---------------------------------------------------------------------------

  - rule_id: INV-007
    name: SQL — invoices with zero total amount
    description: >
      Invoices where the sum of all line amounts is zero may indicate
      incomplete data or cancelled invoices that were not properly closed.
      Uses the sql shorthand expectation (top-level sql: key).
    expectation: sql
    sql: |
      SELECT Fakturanr, SUM(linje_belop) AS total_belop
      FROM Saksbehandling.Fakturalinjer
      GROUP BY Fakturanr
      HAVING SUM(linje_belop) = 0
    severity: medium
    category: Aggregate
    owner: Finansteam
