# =============================================================================
# MILESTONE BUSINESS RULES — maintained by the Case Management Team
# Table: Saksbehandling.Milepel
#
# Schema assumptions:
#   prosess_id  – foreign key linking this milestone row to Saksbehandling.Prosesser
#   Milepel     – the milestone type / name (e.g. "Startbehandling",
#                 "Stoppbehandling").  Other columns can be used by changing
#                 the "column" or the relevant parameter field in each rule.
#
# How to add a rule:
#   1. Pick the next rule_id (MIL-NNN).
#   2. Choose an expectation:
#        Standard GX:  expect_column_values_to_not_be_null
#                      expect_column_values_to_be_greater_than
#                      expect_column_values_to_be_in_set
#        Generic:      validate_column_comparison
#                        parameters: column_A, column_B,
#                                    operator (>, <, >=, <=, ==, !=),
#                                    pk_column
#                      validate_sequence_order
#                        parameters: value_column, group_column, sort_column,
#                                    expected_sequence (ordered list),
#                                    completion_gate (optional sub-block:
#                                      value_column, value, sort_column —
#                                      only checks sequence for groups that
#                                      have reached the gate),
#                                    allow_loops (optional boolean, default false —
#                                      when true, allows a value to appear more
#                                      than once in the sequence without being
#                                      flagged)
#                      validate_paired_presence
#                        parameters: value_column, group_column,
#                                    required_pairs ([[start, stop], ...]),
#                                    completion_gate (optional sub-block:
#                                      value_column, value, sort_column —
#                                      only checks pairs for groups that
#                                      have reached the gate)
#                      validate_no_orphan
#                        parameters: value_column, group_column,
#                                    pairs ([[start_type, stop_type], ...])
#                      validate_not_null_when
#                        parameters: condition_column, condition_operator (== or IS NOT NULL),
#                                    condition_value, check_columns (list), pk_column
#        SQL fallback: sql_validation / sql (shorthand)
#                        parameters: sql (multiline query),
#                                    pk_column (optional column in result)
#        Aggregate:    validate_aggregate_rule
#                        parameters: column, aggregate (sum/count/avg/min/max),
#                                    operator (>, <, >=, <=, ==, !=), threshold
#                      expect_row_count_to_be_between
#                        parameters: min_value, max_value
#                      expect_unique_combination_of_columns
#                        parameters: columns (list), pk_column
#        Cross-table:  validate_foreign_key
#                        parameters: column, pk_column,
#                                    reference: {table, column}
#   3. All column references are dynamic — edit the "column" or "parameters"
#      block to target a different column without touching Python.
#   4. Optionally set "category" for grouping (e.g. "Completeness",
#      "Business Logic", "Referential Integrity", "Aggregate").
#   5. Add the rule block below and save this file.
#   6. The next validation run will pick it up automatically.
# =============================================================================

rule_group: Milestone
table: Milepel
database: Saksbehandling
description: Data quality rules for milestone records linked to case processes

# Table configuration used by validation_runner.py
pk_column: prosess_id

rules:

  # ---------------------------------------------------------------------------
  # Null / completeness checks
  # ---------------------------------------------------------------------------

  - rule_id: MIL-001
    name: Milepel column cannot be null
    description: >
      Every milestone row must identify the type/name of the milestone.
      A null Milepel means the record cannot be categorised or sequenced.
    expectation: expect_column_values_to_not_be_null
    column: Milepel
    severity: critical
    category: Completeness
    owner: IT

  - rule_id: MIL-002
    name: prosess_id cannot be null
    description: >
      Every milestone row must be linked to a process via prosess_id.
      An unlinked milestone cannot be attributed to any case.
    expectation: expect_column_values_to_not_be_null
    column: prosess_id
    severity: critical
    category: Completeness
    owner: IT
 
  # ---------------------------------------------------------------------------
  # Milestone sequence checks
  # ---------------------------------------------------------------------------

  - rule_id: MIL-003
    name: Milestones must follow the defined sequence
    description: >
      When multiple milestones in the expected sequence are present for the
      same process, they must appear in the correct chronological order.
      Out-of-order milestones indicate timeline recording errors.
    expectation: validate_sequence_order
    parameters:
      value_column: Milepel
      group_column: prosess_id
      sort_column: StartDate
      expected_sequence:
        - Startbehandling
        - Behandling
        - Stoppbehandling
      completion_gate:
        value_column: Milepel
        value: Stoppbehandling
        sort_column: EndDate
    severity: high
    category: Business Logic
    owner: IT

  # ---------------------------------------------------------------------------
  # Milestone pair completeness checks
  # ---------------------------------------------------------------------------

  - rule_id: MIL-004
    name: Milestone pairs must both be present
    description: >
      For each required pair, if either milestone type exists for a process
      the partner milestone must also exist. A half-complete pair means
      the process lifecycle is unresolved.
    expectation: validate_paired_presence
    parameters:
      value_column: Milepel
      group_column: prosess_id
      required_pairs:
        - [Startbehandling, Stoppbehandling]
      completion_gate:
        value_column: Milepel
        value: Stoppbehandling
        sort_column: EndDate
    severity: critical
    category: Business Logic
    owner: IT

  # ---------------------------------------------------------------------------
  # Orphaned (stop-without-start) checks
  # ---------------------------------------------------------------------------

  - rule_id: MIL-005
    name: Stop milestone without start milestone is invalid
    description: >
      A stop-type milestone cannot exist for a process that has no
      corresponding start-type milestone. This represents a broken lifecycle
      record that must be corrected.
    expectation: validate_no_orphan
    parameters:
      value_column: Milepel
      group_column: prosess_id
      pairs:
        - [Startbehandling, Stoppbehandling]
    severity: high
    category: Business Logic
    owner: IT

  # ---------------------------------------------------------------------------
  # SQL fallback validations (sql_validation)
  # Write the query so that every returned row represents a violation.
  # ---------------------------------------------------------------------------

  - rule_id: MIL-006
    name: No milestone with EndDate before StartDate (SQL)
    description: >
      SQL fallback: detects milestone rows where EndDate is earlier than
      StartDate. Groups by milestone type so Power BI drill-through shows the
      affected milestone categories.
    expectation: sql_validation
    parameters:
      sql: |
        SELECT Milepel, COUNT(1) AS violation_count
        FROM Saksbehandling.Milepel
        WHERE EndDate IS NOT NULL
          AND StartDate IS NOT NULL
          AND EndDate < StartDate
        GROUP BY Milepel
        HAVING COUNT(1) > 0
      pk_column: Milepel
    severity: critical
    category: Business Logic
    owner: IT

  # ---------------------------------------------------------------------------
  # Cross-table / referential integrity validations
  # ---------------------------------------------------------------------------

  - rule_id: MIL-007
    name: prosess_id must exist in Prosesser table
    description: >
      Every prosess_id value in Milepel must reference an existing process in
      Saksbehandling.Prosesser.  Orphaned milestones (where the parent process
      has been deleted or never existed) break the process lifecycle model.
    expectation: validate_foreign_key
    parameters:
      column: prosess_id
      pk_column: prosess_id
      reference:
        table: Saksbehandling.Prosesser
        column: prosess_id
    severity: critical
    category: Referential Integrity
    owner: IT

  # ---------------------------------------------------------------------------
  # Aggregate validations
  # ---------------------------------------------------------------------------

  - rule_id: MIL-008
    name: Unique combination of prosess_id and Milepel type
    description: >
      The combination of (prosess_id, Milepel) must be unique — i.e. no
      process can have the same milestone type recorded more than once.
      Duplicates indicate data entry errors or failed idempotency.
      This is the canonical uniqueness check for milestone records.
    expectation: expect_unique_combination_of_columns
    parameters:
      columns:
        - prosess_id
        - Milepel
      pk_column: prosess_id
    severity: high
    category: Uniqueness
    owner: IT

  # ---------------------------------------------------------------------------
  # Sequence with repeated steps
  # ---------------------------------------------------------------------------

  - rule_id: MIL-009
    name: Milestones with repeated steps must still follow the defined sequence
    description: >
      Some processes allow a milestone step (e.g. Behandling) to repeat before
      the sequence continues. When allow_loops is true the engine accepts
      repeated occurrences of a step without flagging them as out-of-order,
      while still enforcing that steps do not jump backwards in the sequence.
    expectation: validate_sequence_order
    parameters:
      value_column: Milepel
      group_column: prosess_id
      sort_column: StartDate
      expected_sequence:
        - Startbehandling
        - Behandling
        - Stoppbehandling
      allow_loops: true
      completion_gate:
        value_column: Milepel
        value: Stoppbehandling
        sort_column: EndDate
    severity: high
    category: Business Logic
    owner: IT
