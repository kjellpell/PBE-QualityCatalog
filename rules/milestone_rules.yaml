rule_group: Milestone
table: Milepel
database: Saksbehandling
description: Data quality rules for milestone records linked to case processes
pk_column: prosess_id
rules:
- rule_id: MIL-001
  name: Milepel column cannot be null
  description: 'Every milestone row must identify the type/name of the milestone.
    A null Milepel means the record cannot be categorised or sequenced.

    '
  expectation: not_null
  column: Milepel
  severity: critical
  category: Completeness
  owner: IT
- rule_id: MIL-002
  name: prosess_id cannot be null
  description: 'Every milestone row must be linked to a process via prosess_id. An
    unlinked milestone cannot be attributed to any case.

    '
  expectation: not_null
  column: prosess_id
  severity: critical
  category: Completeness
  owner: IT
- rule_id: MIL-003
  name: Milestones must follow the defined sequence
  description: 'When multiple milestones in the expected sequence are present for
    the same process, they must appear in the correct chronological order. Out-of-order
    milestones indicate timeline recording errors.

    '
  expectation: sequence_ordered
  parameters:
    event_column: Milepel
    group_column: prosess_id
    order_column: StartDate
    expected_sequence:
    - Startbehandling
    - Behandling
    - Stoppbehandling
    completion_gate:
      event_column: Milepel
      value: Stoppbehandling
      order_column: EndDate
  severity: high
  category: Business Logic
  owner: IT
- rule_id: MIL-004
  name: Milestone pairs must both be present
  description: 'For each required pair, if either milestone type exists for a process
    the partner milestone must also exist. A half-complete pair means the process
    lifecycle is unresolved.

    '
  expectation: pairs_present
  parameters:
    event_column: Milepel
    group_column: prosess_id
    required_pairs:
    - - Startbehandling
      - Stoppbehandling
    completion_gate:
      event_column: Milepel
      value: Stoppbehandling
      order_column: EndDate
  severity: critical
  category: Business Logic
  owner: IT
- rule_id: MIL-005
  name: Stop milestone without start milestone is invalid
  description: 'A stop-type milestone cannot exist for a process that has no corresponding
    start-type milestone. This represents a broken lifecycle record that must be corrected.

    '
  expectation: stops_paired_with_starts
  parameters:
    event_column: Milepel
    group_column: prosess_id
    pairs:
    - - Startbehandling
      - Stoppbehandling
  severity: high
  category: Business Logic
  owner: IT
- rule_id: MIL-006
  name: No milestone with EndDate before StartDate (SQL)
  description: 'SQL fallback: detects milestone rows where EndDate is earlier than
    StartDate. Groups by milestone type so Power BI drill-through shows the affected
    milestone categories.

    '
  expectation: sql_violations
  parameters:
    sql: "SELECT Milepel, COUNT(1) AS violation_count\nFROM Saksbehandling.Milepel\n\
      WHERE EndDate IS NOT NULL\n  AND StartDate IS NOT NULL\n  AND EndDate < StartDate\n\
      GROUP BY Milepel\nHAVING COUNT(1) > 0\n"
    pk_column: Milepel
  severity: critical
  category: Business Logic
  owner: IT
- rule_id: MIL-007
  name: prosess_id must exist in Prosesser table
  description: 'Every prosess_id value in Milepel must reference an existing process
    in Saksbehandling.Prosesser.  Orphaned milestones (where the parent process has
    been deleted or never existed) break the process lifecycle model.

    '
  expectation: reference_exists
  parameters:
    column: prosess_id
    pk_column: prosess_id
    reference_table: Saksbehandling.Prosesser
    reference_column: prosess_id
  severity: critical
  category: Referential Integrity
  owner: IT
- rule_id: MIL-008
  name: Unique combination of prosess_id and Milepel type
  description: 'The combination of (prosess_id, Milepel) must be unique — i.e. no
    process can have the same milestone type recorded more than once. Duplicates indicate
    data entry errors or failed idempotency. This is the canonical uniqueness check
    for milestone records.

    '
  expectation: combination_unique
  parameters:
    columns:
    - prosess_id
    - Milepel
    pk_column: prosess_id
  severity: high
  category: Uniqueness
  owner: IT
- rule_id: MIL-009
  name: Milestones with repeated steps must still follow the defined sequence
  description: 'Some processes allow a milestone step (e.g. Behandling) to repeat
    before the sequence continues. When allow_loops is true the engine accepts repeated
    occurrences of a step without flagging them as out-of-order, while still enforcing
    that steps do not jump backwards in the sequence.

    '
  expectation: sequence_ordered
  parameters:
    event_column: Milepel
    group_column: prosess_id
    order_column: StartDate
    expected_sequence:
    - Startbehandling
    - Behandling
    - Stoppbehandling
    allow_loops: true
    completion_gate:
      event_column: Milepel
      value: Stoppbehandling
      order_column: EndDate
  severity: high
  category: Business Logic
  owner: IT
