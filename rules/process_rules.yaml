rule_group: Process
table: Prosesser
database: Saksbehandling
description: Data quality rules for the main process / case records (Prosesser)
pk_column: Saksnummer
catalog_filter:
  type: custom
  where_clause: Status IN ('Open', 'Pending')
joins:
- table: Saksbehandling.saker
  on: Saksnummer
  how: left
  select:
  - Saksnummer
  - Status
  - Saksbehandler_kode
rules:
- rule_id: PROC-001
  name: Saksnummer cannot be null
  description: 'Every row in Prosesser must reference a valid case number. A null
    Saksnummer means the process cannot be traced back to a case.

    '
  expectation: not_null
  column: Saksnummer
  severity: critical
  rule_category: Completeness
  owner: Saksteam
- rule_id: PROC-002
  name: Indikator cannot be null
  description: 'Every process must have a valid indicator (case type / sakstype).
    Without an indicator the case cannot be categorised or reported correctly.

    '
  expectation: not_null
  column: Indikator
  severity: high
  rule_category: Completeness
  owner: Saksteam
- rule_id: PROC-003
  name: Saksbehandler_kode cannot be null for open cases
  description: 'Every process where ActualEndDate is null (i.e. the case is still
    open) must be assigned to a handler. Unassigned open cases represent a governance
    gap.

    '
  expectation: not_null_when
  parameters:
    when_column: ActualEndDate
    operator: IS NULL
    checked_columns:
    - Saksbehandler_kode
    pk_column: Saksnummer
  severity: high
  rule_category: Completeness
  owner: Saksteam
- rule_id: PROC-004
  name: ExpectedEndDate must be greater than or equal to StartDate
  description: 'For every process where both dates are set, the expected end date
    must not precede the start date.  A reversed date range indicates a data entry
    error that will cause incorrect duration reporting.

    '
  expectation: comparison
  parameters:
    left_column: ExpectedEndDate
    right_column: StartDate
    operator: '>='
    pk_column: Saksnummer
  severity: critical
  rule_category: Business Logic
  owner: Saksteam
- rule_id: PROC-005
  name: ActualEndDate must be greater than or equal to StartDate
  description: 'For completed processes, the actual end date must not precede the
    start date.  This guards against transposed or incorrect date recording.

    '
  expectation: comparison
  parameters:
    left_column: ActualEndDate
    right_column: StartDate
    operator: '>='
    pk_column: Saksnummer
  severity: high
  rule_category: Business Logic
  owner: Saksteam
- rule_id: PROC-006
  name: No process with ActualEndDate before StartDate (SQL)
  description: 'SQL fallback rule: directly queries the database for process rows
    where ActualEndDate is earlier than StartDate.  Provides a fast, index-backed
    check for date-order integrity without loading data into memory.

    '
  expectation: sql_violations
  parameters:
    sql: "SELECT Saksnummer, StartDate, ActualEndDate\nFROM Saksbehandling.Prosesser\n\
      WHERE ActualEndDate IS NOT NULL\n  AND StartDate IS NOT NULL\n  AND ActualEndDate\
      \ < StartDate\n"
    pk_column: Saksnummer
  severity: high
  rule_category: Business Logic
  owner: Saksteam
- rule_id: PROC-007
  name: Process table must contain at least one row
  description: 'The Prosesser table must never be empty.  Zero rows indicates that
    either the data load failed or all processes were unexpectedly deleted. Adjust
    min_value and max_value to match expected data volumes.

    '
  expectation: row_count_in_range
  parameters:
    min_value: 1
    max_value: 10000000
  severity: critical
  rule_category: Aggregate
  owner: Saksteam
- rule_id: PROC-008
  name: Saksnummer must be unique across all processes
  description: 'Each Saksnummer must appear exactly once in Prosesser.  Duplicate
    case numbers indicate a data ingestion or deduplication issue that will distort
    all downstream reporting.

    '
  expectation: combination_unique
  parameters:
    columns:
    - Saksnummer
    pk_column: Saksnummer
  severity: critical
  rule_category: Uniqueness
  owner: Saksteam
- rule_id: PROC-009
  name: Saksbehandler_kode must reference an active employee
  description: 'Every handler code assigned to a process must exist as an active employee
    in the employee register. A handler who has left the organisation must not remain
    assigned to open cases.

    '
  expectation: reference_active
  parameters:
    source_column: Saksbehandler_kode
    pk_column: Saksnummer
    reference_table: Saksbehandling.Ansatte
    reference_column: AnsattKode
    reference_active_column: Status
    reference_active_value: Aktiv
  severity: high
  rule_category: Referential Integrity
  owner: Saksteam
- rule_id: PROC-010
  name: Open cases must not exceed 30 days without closure
  description: 'A process that has no ActualEndDate (still open) must not have been
    running for more than 30 days since StartDate. Cases exceeding this threshold
    require review and reassignment or closure.

    '
  expectation: state_duration_within_limit
  parameters:
    start_column: StartDate
    open_state_column: ActualEndDate
    open_state_value: null
    pk_column: Saksnummer
    max_days: 30
  severity: high
  rule_category: Business Logic
  owner: Saksteam
