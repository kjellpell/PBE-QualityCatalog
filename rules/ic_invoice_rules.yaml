rule_group: IC-Invoice
table: Fakturalinjer
database: Saksbehandling
description: Internal control rules for invoice line records
pk_column: Fakturanr
rules:
- rule_id: IC-INV-001
  name: Invoice approver must differ from requester
  description: 'The employee who raises an invoice must not be the same employee who
    approves it for payment.  Segregation of duties control (COSO CC5.2).

    '
  expectation: comparison
  parameters:
    left_column: ApprovedBy
    right_column: RequestedBy
    operator: '!='
    pk_column: Fakturanr
  severity: critical
  category: Segregation of Duties
  owner: Finansteam
  control_ref: COSO-CC5.2
  control_type: Detective
  risk_domain: Financial
  remediation_due_days: 2
- rule_id: IC-INV-002
  name: Payment date must not precede approval date
  description: 'An invoice must not be recorded as paid before the formal approval
    timestamp.  A payment before approval indicates a process bypass.

    '
  expectation: comparison
  parameters:
    left_column: PaymentDate
    right_column: ApprovalDate
    operator: '>='
    pk_column: Fakturanr
  severity: critical
  category: Business Logic
  owner: Finansteam
  control_ref: COSO-CC5.3
  control_type: Detective
  risk_domain: Financial
  remediation_due_days: 2
- rule_id: IC-INV-003
  name: Invoice amount must be within approved budget line
  description: 'Invoice total must not exceed the approved budget ceiling for its
    cost centre.  Overspend requires a formal budget adjustment before the invoice
    is approved.

    '
  expectation: sql_violations
  sql: 'SELECT f.Fakturanr

    FROM Saksbehandling.Fakturalinjer f

    JOIN Saksbehandling.Budsjett b ON f.KostsenterKode = b.KostsenterKode

    WHERE f.Belop > b.Ceiling

    '
  severity: high
  category: Business Logic
  owner: Finansteam
  control_ref: COSO-CC5.4
  control_type: Detective
  risk_domain: Financial
  remediation_due_days: 5
