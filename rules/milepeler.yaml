rule_group: Milepæler
table: milepel
database: saksbehandling
description: Datakvalitet på milepæler knyttet til saksfaser
pk_column: milepel_id
rules:
- rule_id: MIL-001
  name: Milepel kan ikke være null
  description: 'Hver milepelrad må identifisere typen/navnet på milepelen. En blank milepel
    betyr at posten ikke kan kategoriseres eller sekvensieres.'
  expectation: not_null
  column: milepel
  severity: Kritisk
  owner: Teknologi
- rule_id: MIL-002
  name: prosess_id kan ikke være null
  description: 'Hver milepelrad må være knyttet til en prosess via prosess_id. En
    milepel uten tilknytning kan ikke tilordnes noen fase.'
  expectation: not_null
  column: prosess_id
  severity: Kritisk
  owner: Teknologi
- rule_id: MIL-003
  name: Milepæler må følge den definerte sekvensen
  description: 'Når flere milepæler i den forventede sekvensen er til stede for
    samme prosess, må de vises i riktig kronologisk rekkefølge.'
  expectation: sequence_ordered
  parameters:
    event_column: milepel
    group_column: prosess_id
    order_column: sluttdato
    loop_all: true
    expected_sequence:
    - value: Høringsfrist høring og offentlig ettersyn
    - value: Merknader oversendt
    - value: Mottatt revidert planforslag
    - value: Anmodning om oppdatert plandokumentasjon
      loop: true
    - value: Mottatt oppdatert plandokumentasjon
      loop: true
    - value: Mottatt komplett revidert planforslag
    completion_gate:
      event_column: milepel
      value: Sendt til politisk behandling
      order_column: sluttdato
  severity: høy
  owner: Styring
- rule_id: MIL-004
  name: Begge milepæler i et par må være tilstede
  description: 'For ethvert påkrevd par, hvis en av milepæltypene eksisterer for en prosess,
    må partnermilepælen også eksistere.'
  expectation: pairs_present
  parameters:
    event_column: milepel
    group_column: prosess_id
    required_pairs:
      - [Merknader oversendt, Mottatt revidert planforslag]
      - [Anmodning om oppdatert plandokumentasjon, Mottatt oppdatert plandokumentasjon]
    completion_gate:
      event_column: milepel
      value: Sendt til politisk behandling
      order_column: sluttdato
  severity: critical
  owner: IT
- rule_id: MIL-005
  name: Stop milestone without start milestone is invalid
  description: A stop-type milestone cannot exist for a process that has no corresponding
    start-type milestone. This represents a broken lifecycle record that must be corrected.
  expectation: pairs_present
  parameters:
    event_column: Milepel
    group_column: prosess_id
    required_pairs:
    - - Startbehandling
      - Stoppbehandling
    mode: stop_requires_start
  severity: high
  owner: IT
- rule_id: MIL-006
  name: No milestone with EndDate before StartDate (SQL)
  description: 'SQL fallback: detects milestone rows where EndDate is earlier than
    StartDate. Groups by milestone type so Power BI drill-through shows the affected
    milestone categories.

    '
  expectation: sql_violations
  parameters:
    sql: "SELECT Milepel, COUNT(1) AS violation_count\nFROM Saksbehandling.Milepel\n\
      WHERE EndDate IS NOT NULL\n  AND StartDate IS NOT NULL\n  AND EndDate < StartDate\n\
      GROUP BY Milepel\nHAVING COUNT(1) > 0\n"
    pk_column: Milepel
  severity: critical
  owner: IT
- rule_id: MIL-007
  name: prosess_id must exist in Prosesser table
  description: 'Every prosess_id value in Milepel must reference an existing process
    in Saksbehandling.Prosesser.  Orphaned milestones (where the parent process has
    been deleted or never existed) break the process lifecycle model.

    '
  expectation: reference_exists
  parameters:
    column: prosess_id
    pk_column: prosess_id
    reference_table: Saksbehandling.Prosesser
    reference_column: prosess_id
  severity: critical
  owner: IT
- rule_id: MIL-008
  name: Unique combination of prosess_id and Milepel type
  description: 'The combination of (prosess_id, Milepel) must be unique — i.e. no
    process can have the same milestone type recorded more than once. Duplicates indicate
    data entry errors or failed idempotency. This is the canonical uniqueness check
    for milestone records.

    '
  expectation: combination_unique
  parameters:
    columns:
    - prosess_id
    - Milepel
    pk_column: prosess_id
  severity: high
  owner: IT
- rule_id: MIL-009
  name: Milestones with repeated steps must still follow the defined sequence
  description: 'Some processes allow a milestone step (e.g. Behandling) to repeat
    before the sequence continues. When loop_all is true the engine accepts repeated
    occurrences of a step without flagging them as out-of-order, while still enforcing
    that steps do not jump backwards in the sequence.

    '
  expectation: sequence_ordered
  parameters:
    event_column: Milepel
    group_column: prosess_id
    order_column: StartDate
    expected_sequence:
    - Startbehandling
    - Behandling
    - Stoppbehandling
    loop_all: true
    completion_gate:
      event_column: Milepel
      value: Stoppbehandling
      order_column: EndDate
  severity: high
  owner: IT
