rule_group: Milepæler
table: milepaeler
database: saksbehandling
description: Datakvalitet på milepæler knyttet til saksfaser
pk_column: milestone_recno

# Jeg har valgt å kun se på PB360-saker per nå
where: fagsystem = 'PB360'

rules:

# Én regel per kolonne, slik at rule_id peker på nøyaktig én feil.
- rule_id: MIL-001
  name: milestone_title mangler
  description: 'Alle milepæler må ha et navn.'
  check: milestone_title IS NOT NULL

- rule_id: MIL-002
  name: to_stage_recno mangler
  description: 'Alle milepæler må være knyttet til en fase.'
  check: to_stage_recno IS NOT NULL

# Dette er mer en teknisk sjekk
- rule_id: MIL-003
  name: Milepælen kan ikke være nådd uten sluttdato
  description: 'Milepæler som er nådd må ha en sluttdato.'
  when: statusdescription = 'Nådd'
  check: milestonedate IS NOT NULL

# I PB360 er det en del par av milepæler som skal komme sammen. event_flow
# sjekker at de kommer parvis OG i riktig rekkefølge: et par som åpnes uten å
# lukkes er en feil, mens flere komplette runder er helt i orden.
# Merk completion_gate, som gjør at regelen kun sjekker faser som har nådd
# den angitte milepælen.
- rule_id: MIL-004
  name: Merknader og revidert planforslag må komme parvis og i rekkefølge
  description: 'Hver "Merknader oversendt" må følges av "Mottatt revidert planforslag".'
  event_flow:
    event_column: milestone_title
    group_column: to_stage_recno
    order_column: milestonedate
    cycle:
    - Merknader oversendt
    - Mottatt revidert planforslag
    completion_gate:
      event_column: milestone_title
      value: Sendt til politisk behandling
      order_column: milestonedate

- rule_id: MIL-005
  name: Anmodning og mottatt plandokumentasjon må komme parvis for politisk behandling
  description: 'Hver anmodning må følges av mottatt oppdatert plandokumentasjon.'
  event_flow:
    event_column: milestone_title
    group_column: to_stage_recno
    order_column: milestonedate
    cycle:
    - Anmodning om oppdatert plandokumentasjon
    - Mottatt oppdatert plandokumentasjon
    completion_gate:
      event_column: milestone_title
      value: Sendt til politisk behandling
      order_column: milestonedate

# Samme par, men for offentlig ettersyn
- rule_id: MIL-006
  name: Anmodning og mottatt plandokumentasjon må komme parvis for offentlig ettersyn
  description: 'Hver anmodning må følges av mottatt oppdatert plandokumentasjon.'
  event_flow:
    event_column: milestone_title
    group_column: to_stage_recno
    order_column: milestonedate
    cycle:
    - Anmodning om oppdatert plandokumentasjon
    - Mottatt oppdatert plandokumentasjon
    completion_gate:
      event_column: milestone_title
      value: Vedtak høring og offentlig ettersyn
      order_column: milestonedate

# Samme par, men for oppstartsmøte
- rule_id: MIL-007
  name: Anmodning og mottatt plandokumentasjon må komme parvis for oppstartsmøte
  description: 'Hver anmodning må følges av mottatt oppdatert plandokumentasjon.'
  event_flow:
    event_column: milestone_title
    group_column: to_stage_recno
    order_column: milestonedate
    cycle:
    - Anmodning om oppdatert plandokumentasjon
    - Mottatt oppdatert plandokumentasjon
    completion_gate:
      event_column: milestone_title
      value: Innkalling til oppstartsmøte
      order_column: milestonedate
