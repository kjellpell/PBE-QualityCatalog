rule_group: Milepæler
table: milepaeler
database: saksbehandling
description: Datakvalitet på milepæler knyttet til saksfaser
pk_column: milestone_recno
catalog_filter:
  type: custom
  where_clause: fagsystem = 'PB360'
rules:
- rule_id: MIL-001
  name: Milepel kan ikke være null
  description: 'Hver milepelrad må identifisere typen/navnet på milepelen. En blank milepel
    betyr at posten ikke kan kategoriseres eller sekvensieres.'
  expectation: not_null
  column: milestone_title
  severity: kritisk
  owner: Teknologi
- rule_id: MIL-002
  name: prosess_id kan ikke være null
  description: 'Hver milepelrad må være knyttet til en prosess via prosess_id. En
    milepel uten tilknytning kan ikke tilordnes noen fase.'
  expectation: not_null
  column: to_stage_recno
  severity: kritisk
  owner: Teknologi
- rule_id: MIL-003
  name: Til politisk behandling må følge definert sekvens
  description: 'Når flere milepæler i den forventede sekvensen er til stede for
    samme prosess, må de vises i riktig kronologisk rekkefølge.'
  expectation: sequence_ordered
  parameters:
    event_column: milestone_title
    group_column: to_stage_recno
    order_column: milestonedate
    expected_sequence:
    - value: Høringsfrist høring og offentlig ettersyn
    - value: Merknader oversendt
    - value: Mottatt revidert planforslag
    - value: Anmodning om oppdatert plandokumentasjon
      loop: true
    - value: Mottatt oppdatert plandokumentasjon
      loop: true
    - value: Mottatt komplett revidert planforslag
    completion_gate:
      event_column: milestone_title
      value: Sendt til politisk behandling
      order_column: milestonedate
  severity: høy
  owner: Teknologi
- rule_id: MIL-004
  name: Begge milepæler i et par må være tilstede
  description: 'For ethvert påkrevd par må partnermilepælen også eksistere.'
  expectation: pairs_present
  parameters:
    event_column: milestone_title
    group_column: to_stage_recno
    required_pairs:
      - [Merknader oversendt, Mottatt revidert planforslag]
      - [Anmodning om oppdatert plandokumentasjon, Mottatt oppdatert plandokumentasjon]
    completion_gate:
      event_column: milestone_title
      value: Sendt til politisk behandling
      order_column: milestonedate
  severity: kritisk
  owner: Teknologi
- rule_id: MIL-005
  name: Milepæler for en fase må ha unike datoer
  description: 'For hver prosess_id, må hver milepel ha en unik sluttdato.'
  expectation: combination_unique
  parameters:
    columns:
    - to_stage_recno
    - milestonedate
  severity: høy
  owner: Teknologi
- rule_id: MIL-006
  name: Milepælen kan ikke være nådd uten sluttdato
  description: 'Milepæler som er nådd må ha en sluttdato.'
  expectation: not_null_when
  parameters:
    when_column: statusdescription
    operator: ==
    value: Nådd
    checked_columns:
      - milestonedate
  severity: høy
  owner: Teknologi