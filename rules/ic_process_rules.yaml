rule_group: IC-Process
table: Prosesser
database: Saksbehandling
description: Internal control rules for case process records
pk_column: Saksnummer
joins:
- table: Saksbehandling.saker
  true: Saksnummer
  how: left
  select:
  - Saksnummer
  - Status
rules:
- rule_id: IC-PROC-001
  name: No self-approval on process cases
  description: 'The case handler who creates a process record must not be the same
    person who approves it. Segregation of duties control (COSO CC5.2).

    '
  expectation: comparison
  parameters:
    left_column: ApprovedBy
    right_column: CreatedBy
    operator: '!='
    pk_column: Saksnummer
  severity: critical
  category: Segregation of Duties
  owner: Saksteam
  control_ref: COSO-CC5.2
  control_type: Detective
  risk_domain: Operational
  remediation_due_days: 3
- rule_id: IC-PROC-002
  name: All mandatory milestones completed before case closure
  description: 'A case may not have status Closed unless all required milestone steps
    are recorded as complete.  Any open mandatory milestone on a closed case is a
    process control violation.

    '
  expectation: sql_violations
  sql: "SELECT p.Saksnummer\nFROM Saksbehandling.Prosesser p\nWHERE p.Status = 'Closed'\n\
    \  AND EXISTS (\n    SELECT 1 FROM Saksbehandling.Milepel m\n    WHERE m.Saksnummer\
    \ = p.Saksnummer\n      AND m.Required    = true\n      AND m.CompletedAt IS NULL\n\
    \  )\n"
  severity: high
  category: Completeness
  owner: Saksteam
  control_ref: COSO-CC4.1
  control_type: Preventive
  risk_domain: Operational
  remediation_due_days: 5
