rule_group: Faktura
table: fakturalinjer
database: saksbehandling
description: Datakvalitet på fakturalinjer som kommer fra PB360
pk_column: fakturanr

rules:

# Sjekk for påkrevde kolonner
- rule_id: FAK-001
  name: Verdier kan ikke være null
  description: 'Verdier kan ikke være null.'
  expectation: not_null
  parameters:
    columns:
      - fakturanr
      - linje_belop

# De neste gjør tekniske sjekker på fakturalinjene
- rule_id: FAK-002
  name: Alle fakturalinjer må ha samme sum som total
  description: 'Summen av alle linje_belop-verdier for en gitt Fakturanr må være lik
    Faktura_belop registrert på fakturahodet (innenfor en liten toleranse). En
    avvik indikerer enten manglende linjer eller en oppdatering av hodet som ikke ble reflektert
    i detaljlinjene.'
  expectation: group_aggregate_matches
  parameters:
    group_column: fakturanr
    aggregate_column: linje_belop
    reference_column: fakturasum
    aggregate: sum
    tolerance: 0.01