rule_group: Faktura
table: fakturalinjer
database: saksbehandling
description: Datakvalitet på fakturalinjer som kommer fra PB360
pk_column: fakturanr
ownership_col: ""

# Sjekk kdenne
context_columns:
  - prosess_id 
rules:

# Sjekk for påkrevde kolonner
- rule_id: FAK-001
  name: Verdier kan ikke være null
  description: 'Verdier kan ikke være null.'
  expectation: not_null
  parameters:
    columns:
      - fakturanr
      - linje_belop
  routing: it-ops

# Avstem fakturalinjer og total, dette er en teknisk avstemming
- rule_id: FAK-002
  name: Alle fakturalinjer må ha samme sum som total
  description: 'Summen av alle linje_belop-verdier for en gitt Fakturanr må være lik
    Faktura_belop registrert på fakturahodet (innenfor en liten toleranse). En
    avvik indikerer enten manglende linjer eller en oppdatering av hodet som ikke ble reflektert
    i detaljlinjene.'
  expectation: group_aggregate_matches
  parameters:
    group_column: fakturanr
    aggregate_column: linje_belop
    reference_column: faktura_belop
    aggregate: sum
    tolerance: 0.01
  routing: it-ops

# De neste gjør tekniske sjekker på fakturaen
- rule_id: FAK-003
  name: Kun godkjente fakturatyper kan brukes
  description: Kun godkjente fakturatyper kan brukes.
  expectation: value_in_list
  parameters:
    column: faktura_type
    allowed_values:
      - Standard
      - Kreditnota
  routing: it-ops

- rule_id: FAK-004
  name: Sjekk negative beløp på kreditnota
  description: Negative beløp er ikke tillatt, med mindre det er en kreditnota.
  expectation: value_when
  parameters:
    when_column: linje_belop
    operator: "<"
    value: 0
    required_column: faktura_type
    required_value: Kreditnota

- rule_id: FAK-005
  name: Sjekk positive beløp på standardfaktura
  description: Alle standardfaktura må ha positive beløp.
  expectation: value_when
  parameters:
    when_column: linje_belop
    operator: ">"
    value: 0
    required_column: faktura_type
    required_value: Standard